# WireGuard client config template
# Replace placeholders before importing into WireGuard app.

[Interface]
PrivateKey = <CLIENT-PRIVATE-KEY>
Address = <CLIENT-IP>/32
DNS = 1.1.1.1

[Peer]
PublicKey = <SERVER-PUBLIC-KEY>
Endpoint = <DDNS-HOSTNAME>:51820
AllowedIPs = 10.0.0.0/24, 192.168.0.0/16
PersistentKeepalive = 25
