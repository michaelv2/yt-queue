<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yt-queue — Archive</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>yt-queue</h1>
    <nav>
      <a href="/">Submit</a>
      <a href="/triage.html">Previews</a>
      <a href="/previews.html">Thumbnails</a>
      <a href="/archive.html" class="active">Archive</a>
    </nav>
  </header>

  <main>
    <div class="archive-controls">
      <span id="total-count" class="total-count"></span>
      <input type="text" id="search-input" placeholder="Search transcripts…" autocomplete="off">
      <div class="score-controls">
        <input type="text" id="score-criteria" placeholder="Score by criteria…" autocomplete="off">
        <button id="score-btn">Score all</button>
        <span id="score-status" class="score-status hidden"></span>
      </div>
      <div class="category-controls">
        <select id="category-filter">
          <option value="">All categories</option>
        </select>
        <select id="tag-filter">
          <option value="">All tags</option>
          <option value="watched">👁 Watched</option>
          <option value="unwatched">👁 Unwatched</option>
          <option value="flagged">★ Flagged</option>
          <option value="marked_for_deletion">🗑 Marked for deletion</option>
          <option value="has_audio">♪ Has audio</option>
        </select>
        <button id="categorize-btn">Categorize</button>
        <span id="categorize-status" class="score-status hidden"></span>
      </div>
      <button id="delete-btn" class="btn-danger hidden">Delete selected</button>
    </div>
    <div id="score-criteria-indicator" class="score-criteria-indicator" hidden></div>
    <div id="archive-table-wrap">
      <table id="archive-table">
        <thead>
          <tr>
            <th><input type="checkbox" id="select-all"></th>
            <th data-col="title" data-label="Title">Title</th>
            <th data-col="duration" data-label="Duration">Duration</th>
            <th>Summary</th>
            <th data-col="category" data-label="Category">Category</th>
            <th data-col="relevance_score" data-label="Score">Score ↓<div id="score-criteria-label" class="score-criteria-label"></div></th>
            <th data-col="batch_id" data-label="Batch">Batch</th>
            <th data-col="archived_at" data-label="Archived">Archived</th>
          </tr>
        </thead>
        <tbody id="archive-body"></tbody>
      </table>
    </div>
    <div id="pagination" class="pagination"></div>
  </main>

  <script src="/archive.js"></script>
</body>
</html>
