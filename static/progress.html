<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yt-queue — Progress</title>
  <link rel="stylesheet" href="/style.css">
  <script>(function(){var t=localStorage.getItem('ytqueue_theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
  <style>
    /* ── Overall layout ──────────────────────────────────────────────────── */
    .progress-page { display: flex; flex-direction: column; gap: 28px; }

    /* ── Hero progress card ──────────────────────────────────────────────── */
    .hero-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 28px 24px;
    }
    .hero-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .hero-title { font-size: 1.15rem; font-weight: 700; }
    .hero-subtitle { font-size: 0.82rem; color: var(--text-muted); margin-top: 3px; }
    .hero-actions { display: flex; gap: 8px; align-items: center; flex-shrink: 0; }

    .hero-bar-wrap {
      background: var(--surface2);
      border-radius: 6px;
      height: 12px;
      overflow: hidden;
      margin-bottom: 10px;
    }
    .hero-bar {
      height: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--accent), #a78bfa);
      transition: width .4s ease;
    }
    .hero-bar.complete { background: var(--success); }
    .hero-bar.failed   { background: var(--danger); }

    .hero-stats {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .stat { display: flex; flex-direction: column; gap: 2px; }
    .stat-val { font-size: 1.4rem; font-weight: 700; color: var(--text); line-height: 1; }
    .stat-val.ok  { color: var(--success); }
    .stat-val.bad { color: var(--danger); }
    .stat-val.dim { color: var(--text-muted); }

    /* ── Status pill ─────────────────────────────────────────────────────── */
    .status-pill {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .04em;
      border-radius: 3px;
      padding: 3px 10px;
    }
    .status-pill.processing { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
    .status-pill.complete   { background: color-mix(in srgb, var(--success) 15%, transparent); color: var(--success); }
    .status-pill.failed     { background: color-mix(in srgb, var(--danger) 15%, transparent); color: var(--danger); }
    .status-pill.pending    { background: var(--surface2); color: var(--text-muted); }

    /* ── Section headers ─────────────────────────────────────────────────── */
    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .section-title {
      font-size: 0.78rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .06em;
      color: var(--text-muted);
    }

    /* ── Job rows ────────────────────────────────────────────────────────── */
    .job-rows { display: flex; flex-direction: column; gap: 6px; }

    .job-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 12px;
      align-items: center;
    }
    .job-item.is-active  { border-color: var(--accent); }
    .job-item.is-done    { border-color: var(--success); opacity: 0.75; }
    .job-item.is-failed  { border-color: var(--danger); }
    .job-item.is-queued  { opacity: 0.55; }

    .job-status-col { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
    .job-badge {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      border-radius: 4px;
      padding: 2px 6px;
      white-space: nowrap;
    }
    .job-badge.queued      { background: var(--surface); color: var(--text-muted); border: 1px solid var(--border); }
    .job-badge.downloading { background: var(--accent); color: #fff; }
    .job-badge.transcribing{ background: #7c3aed; color: #fff; }
    .job-badge.summarizing { background: #0891b2; color: #fff; }
    .job-badge.completed   { background: var(--success); color: #000; }
    .job-badge.failed      { background: var(--danger); color: #fff; }

    .job-mini-bar-wrap { background: var(--surface); border-radius: 3px; height: 3px; overflow: hidden; width: 100%; }
    .job-mini-bar { background: var(--accent); height: 100%; transition: width .3s; }
    .job-item.is-done .job-mini-bar { background: var(--success); width: 100% !important; }
    .job-item.is-failed .job-mini-bar { background: var(--danger); }

    .job-info-col { min-width: 0; }
    .job-name {
      font-size: 0.88rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 2px;
    }
    .job-name a { color: var(--text); }
    .job-name a:hover { color: var(--accent); text-decoration: none; }
    .job-meta { font-size: 0.75rem; color: var(--text-muted); }
    .job-error-text { font-size: 0.75rem; color: var(--danger); margin-top: 2px; }

    .job-action-col { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }

    /* ── Queue panel ─────────────────────────────────────────────────────── */
    .queue-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }
    .queue-list { display: flex; flex-direction: column; gap: 4px; }
    .queue-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border);
    }
    .queue-item:last-child { border-bottom: none; }
    .queue-pos {
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text-muted);
      background: var(--surface2);
      border-radius: 4px;
      padding: 1px 6px;
      min-width: 28px;
      text-align: center;
    }
    .queue-id { font-size: 0.78rem; font-family: monospace; color: var(--text-muted); }

    /* ── Completion banner ───────────────────────────────────────────────── */
    .complete-banner {
      background: color-mix(in srgb, var(--success) 10%, transparent);
      border: 1px solid color-mix(in srgb, var(--success) 30%, transparent);
      border-radius: var(--radius);
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .complete-banner h3 { font-size: 1rem; color: var(--success); }
    .complete-banner p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; }

    .spinner {
      display: inline-block;
      width: 14px;
      height: 14px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .7s linear infinite;
      vertical-align: middle;
      margin-right: 6px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-state {
      text-align: center;
      padding: 60px 0;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .error-state {
      text-align: center;
      padding: 60px 0;
      color: var(--danger);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>yt-queue</h1>
    <nav>
      <a href="/">Submit</a>
      <a href="/progress.html" class="active">Progress</a>
      <a href="/triage.html">Previews</a>
      <a href="/previews.html">Thumbnails</a>
      <a href="/archive.html">Archive</a>
      <a href="/settings.html">Settings</a>
    </nav>
  </header>

  <main>
    <div class="progress-page" id="progress-page">
      <div class="loading-state">
        <span class="spinner"></span> Loading batch…
      </div>
    </div>
  </main>

  <script src="/progress.js"></script>
</body>
</html>
