<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>yt-queue — Thumbnails</title>
  <link rel="stylesheet" href="/style.css">
  <script>(function(){var t=localStorage.getItem('ytqueue_theme');if(t)document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>
  <header>
    <h1>yt-queue</h1>
    <nav>
      <a href="/">Submit</a>
      <a href="/progress.html">Progress</a>
      <a href="/triage.html">Previews</a>
      <a href="/previews.html" class="active">Thumbnails</a>
      <a href="/archive.html">Archive</a>
      <a href="/settings.html">Settings</a>
    </nav>
  </header>

  <main>
    <div class="previews-controls">
      <span id="total-count" class="total-count"></span>
      <select id="batch-filter">
        <option value="">All batches</option>
      </select>
      <select id="category-filter">
        <option value="">All categories</option>
      </select>
      <select id="tag-filter">
        <option value="">All tags</option>
        <option value="watched">Watched</option>
        <option value="unwatched">Unwatched</option>
        <option value="flagged">Flagged</option>
        <option value="marked_for_deletion">Marked for deletion</option>
        <option value="has_audio">Has audio</option>
      </select>
    </div>

    <div id="thumb-grid" class="thumb-grid"></div>
  </main>

  <script src="/previews.js"></script>
</body>
</html>
